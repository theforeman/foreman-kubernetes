              Maintainer: Foreman Kubernetes Integration
              Installed-Size: 1
              Filename: ${deb_pool}/${deb_filename}
              Size: ${deb_size}
              MD5sum: ${deb_md5}
              SHA1: ${deb_sha1}
              SHA256: ${deb_sha256}
              Section: admin
