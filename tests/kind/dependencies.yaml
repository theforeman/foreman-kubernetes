              Suite: stable
              Codename: stable
              Date: Fri, 25 Sep 2026 00:00:00 +0000
              Architectures: amd64
              Components: main
              Description: deterministic Foreman Kubernetes Debian repository
              MD5Sum:
               ${packages_md5} ${packages_size} main/binary-amd64/Packages
               ${packages_gz_md5} ${packages_gz_size} main/binary-amd64/Packages.gz
              SHA256:
               ${packages_sha256} ${packages_size} main/binary-amd64/Packages
               ${packages_gz_sha256} ${packages_gz_size} main/binary-amd64/Packages.gz
              EOF

              rpm_root=/served/rpm
              rpm_metadata_root="${temporary_root}/rpm-metadata"
              rpm_checksum=251768bdd15f13d78487c27638aa6aecd01551e253756093cde1c0ae878a17d2
              mkdir -p "${rpm_root}/repodata" "${rpm_metadata_root}"
              cp /source/rpm-squirrel.rpm "${rpm_root}/squirrel-0.3-0.8.noarch.rpm"
              cat > "${rpm_metadata_root}/primary.xml" <<EOF
              <?xml version="1.0" encoding="UTF-8"?>
              <metadata xmlns="http://linux.duke.edu/metadata/common" xmlns:rpm="http://linux.duke.edu/metadata/rpm" packages="1">
              <package type="rpm">
                <name>squirrel</name>
                <arch>noarch</arch>
                <version epoch="0" ver="0.3" rel="0.8"/>
                <checksum type="sha256" pkgid="YES">${rpm_checksum}</checksum>
                <summary>A dummy package of squirrel</summary>
                <description>A dummy package of squirrel</description>
                <packager></packager>
                <url>http://tstrachota.fedorapeople.org</url>
                <time file="1629229056" build="1308257502"/>
