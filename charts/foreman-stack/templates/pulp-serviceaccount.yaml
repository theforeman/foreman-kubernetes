{{- if .Values.pulp.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "foreman-stack.pulpServiceAccountName" . }}
  labels:
    {{- include "foreman-stack.componentLabels" (dict "root" . "component" "pulp") | nindent 4 }}
  {{- with .Values.pulp.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
