apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "foreman-stack.pulpControlProxyServiceName" . }}
  labels:
    {{- include "foreman-stack.componentLabels" (dict "root" . "component" "pulp-control-proxy") | nindent 4 }}
data:
  default.conf: |
{{ include "foreman-stack.pulpControlProxyConfig" . | indent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "foreman-stack.pulpControlProxyServiceName" . }}
  annotations:
    foreman-kubernetes.io/certificate-secret: {{ .Values.pulp.controlProxy.existingCertificateSecret | quote }}
    foreman-kubernetes.io/certificate-key: "tls.crt"
    foreman-kubernetes.io/certificate-dns-name: {{ include "foreman-stack.pulpControlProxyServiceName" . | quote }}
  labels:
    {{- include "foreman-stack.componentLabels" (dict "root" . "component" "pulp-control-proxy") | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: pulp-control-proxy
  ports:
    - name: https
      port: {{ .Values.pulp.controlProxy.service.port }}
      targetPort: https
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "foreman-stack.pulpControlProxyServiceName" . }}
  labels:
    {{- include "foreman-stack.componentLabels" (dict "root" . "component" "pulp-control-proxy") | nindent 4 }}
spec:
  progressDeadlineSeconds: {{ .Values.platform.deploymentProgressDeadlineSeconds }}
  replicas: {{ .Values.pulp.controlProxy.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: pulp-control-proxy
  template:
    metadata:
      labels:
        {{- include "foreman-stack.podLabels" (dict "root" . "component" "pulp-control-proxy") | nindent 8 }}
      annotations:
        checksum/config: {{ include "foreman-stack.pulpControlProxyConfig" . | sha256sum }}
        checksum/secrets: {{ .Values.secretRolloutToken | sha256sum }}
    spec:
      {{- include "foreman-stack.scheduling" . | nindent 6 }}
      serviceAccountName: {{ include "foreman-stack.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- include "foreman-stack.imagePullSecrets" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: {{ include "foreman-stack.image" .Values.pulp.controlProxy.image }}
          imagePullPolicy: {{ .Values.pulp.controlProxy.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          ports:
            - name: https
              containerPort: {{ .Values.pulp.controlProxy.port }}
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: certificates
              mountPath: /etc/nginx/pki
              readOnly: true
            - name: temporary
              mountPath: /tmp
          startupProbe:
            tcpSocket:
              port: https
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: https
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: https
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.pulp.controlProxy.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "foreman-stack.pulpControlProxyServiceName" . }}
        - name: certificates
          secret:
            secretName: {{ .Values.pulp.controlProxy.existingCertificateSecret }}
            items:
              - key: ca.crt
                path: ca.crt
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
        - name: temporary
          emptyDir: {}
      {{- include "foreman-stack.topologySpread" (dict "Values" .Values "Release" .Release "component" "pulp-control-proxy") | nindent 6 }}
{{- if .Values.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "foreman-stack.pulpControlProxyServiceName" . }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: pulp-control-proxy
{{- end }}
