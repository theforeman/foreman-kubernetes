{{- if or .Values.backup.enabled .Values.restore.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "foreman-stack.fullname" . }}-recovery-egress
  labels:
    {{- include "foreman-stack.componentLabels" (dict "root" . "component" "recovery-egress") | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/instance
        operator: In
        values: [{{ .Release.Name | quote }}]
      - key: app.kubernetes.io/component
        operator: In
        values:
          - recovery-backup
          - recovery-restore
  policyTypes:
    - Egress
  egress:
    - to:
        - {{- toYaml $dns | nindent 10 }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        {{- toYaml $database.peers | nindent 8 }}
      ports:
        {{- range $database.ports }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    - to:
        {{- toYaml $recovery.apiServer.peers | nindent 8 }}
      ports:
        {{- range $recovery.apiServer.ports }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    {{- if .Values.outboundProxy.enabled }}
    - to:
        {{- toYaml $outboundProxy.peers | nindent 8 }}
      ports:
        {{- range $outboundProxy.ports }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    {{- end }}
    {{- if not .Values.recovery.repository.existingClaim }}
    - to:
        {{- toYaml $recovery.repository.peers | nindent 8 }}
      ports:
        {{- range $recovery.repository.ports }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    {{- end }}
{{- end }}
{{- end }}
