apiVersion: v1
kind: Pod
metadata:
  name: {{ include "foreman.fullname" . }}-smoke-test
  labels:
    {{- include "foreman.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: ping
      image: {{ .Values.test.image }}
      command:
        - /bin/sh
        - -ec
      args:
        - |
          response="$(curl --fail --silent --show-error \
            --header 'Host: {{ .Values.foreman.fqdn }}' \
            'http://{{ include "foreman.fullname" . }}:{{ .Values.service.port }}/api/v2/ping')"
          printf '%s\n' "${response}"
          printf '%s\n' "${response}" | grep -Eq '"active"[[:space:]]*:[[:space:]]*true'
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        runAsNonRoot: true
        runAsUser: 100
