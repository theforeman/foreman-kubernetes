apiVersion: v1
kind: Service
metadata:
  name: {{ include "foreman-release-operator.fullname" . }}
  labels:
    {{- include "foreman-release-operator.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  publishNotReadyAddresses: true
  selector:
    {{- include "foreman-release-operator.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: {{ .Values.health.port }}
      targetPort: health
      protocol: TCP
