name: Chart checks

on:
  pull_request:
  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  lint:
    name: Chart Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a # v4
        with:
          version: v4.3.0
      - name: Lint charts
        run: make lint

  test:
    name: Foreman Installation
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a # v4
        with:
          version: v4.3.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: helm/kind-action@0b5c88445f37b7e12a2ce1ecca7805b9046a74db # v1
        with:
          install_only: true
          version: v0.33.0
          kubectl_version: v1.34.1
      - name: Install test dependencies
        run: make setup-test-env
      - name: Create Kind cluster using Podman
        run: sudo --preserve-env=PATH make setup-kind
      - name: Test Foreman installation
        run: sudo --preserve-env=PATH make test
      - name: Installation diagnostics
        if: failure()
        run: sudo --preserve-env=PATH make diagnostics
      - name: Remove Kind cluster
        if: always()
        run: sudo --preserve-env=PATH make teardown-kind
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: foreman-test-results
          path: artifacts/junit.xml
          if-no-files-found: warn
