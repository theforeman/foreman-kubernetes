name: Full integration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kind:
    name: Install HA stack, execute, recover, and upgrade
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      KEEP_CLUSTER: "1"
      INTEGRATION_EVIDENCE_FILE: artifacts/integration-result.json
      IMAGE_PLATFORM_CONTRACT_FILE: artifacts/image-platform-contract.json
      IMAGE_RUNTIME_CONTRACT_FILE: artifacts/image-runtime-contract.json
      OPERATOR_RELEASE_EVIDENCE_FILE: artifacts/operator-release.json
      PULP_OBJECT_STORAGE_EVIDENCE_FILE: artifacts/pulp-object-storage.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a # v4
        with:
          version: v3.19.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.7
          cache: false
      - name: Install kind
        run: |
          go install sigs.k8s.io/kind@v0.33.0
          echo "$(go env GOPATH)/bin" >> "${GITHUB_PATH}"
      - name: Run full integration drill
        run: tests/kind/run.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: success()
        with:
          name: foreman-stack-integration-evidence
          path: |
            artifacts/integration-result.json
            artifacts/image-platform-contract.json
            artifacts/image-runtime-contract.json
            artifacts/operator-release.json
            artifacts/pulp-object-storage.json
          if-no-files-found: error
          retention-days: 90
      - name: Collect failure diagnostics
        if: failure()
        run: |
          mkdir -p artifacts
          kubectl get nodes,namespaces,persistentvolumes -o wide > artifacts/cluster.txt 2>&1 || true
          kubectl --namespace foreman get all,persistentvolumeclaims -o wide > artifacts/foreman.txt 2>&1 || true
          kubectl --namespace foreman describe pods,jobs > artifacts/foreman-describe.txt 2>&1 || true
          kubectl --namespace foreman logs --selector=app.kubernetes.io/component=foreman --all-containers --prefix > artifacts/foreman-web.log 2>&1 || true
          kubectl --namespace foreman logs --selector=app.kubernetes.io/component=pulp-api --all-containers --prefix > artifacts/pulp-api.log 2>&1 || true
          kubectl --namespace foreman logs --selector=app.kubernetes.io/component=pulp-content --all-containers --prefix > artifacts/pulp-content.log 2>&1 || true
          kubectl --namespace foreman logs pod/pulp-api-availability > artifacts/pulp-api-availability.log 2>&1 || true
          kubectl --namespace foreman logs deployment/execution-foreman-execution-proxy --all-containers > artifacts/execution-proxy.log 2>&1 || true
          kubectl --namespace foreman logs deployment/execution-target --all-containers > artifacts/execution-target.log 2>&1 || true
          kubectl --namespace foreman logs job/execution-ansible-content-loader > artifacts/execution-ansible-content-loader.log 2>&1 || true
          kubectl --namespace foreman logs deployment/object-storage > artifacts/object-storage.log 2>&1 || true
          kubectl --namespace foreman logs deployment/webhook-receiver --all-containers > artifacts/webhook-receiver.log 2>&1 || true
          kubectl --namespace foreman logs job/foreman-foreman-stack-pulp-object-storage-test > artifacts/pulp-object-storage-test.log 2>&1 || true
          kubectl --namespace foreman get foremanrelease foreman -o yaml > artifacts/foreman-release.yaml 2>&1 || true
          kubectl --namespace foreman logs --selector=app.kubernetes.io/name=foreman-release-operator --all-containers --prefix > artifacts/release-operator.log 2>&1 || true
          kind export logs artifacts/kind --name foreman-stack-e2e || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: foreman-stack-integration-diagnostics
          path: artifacts
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove test cluster
        if: always()
        run: kind delete cluster --name foreman-stack-e2e
