# Copy this file outside Git, replace every placeholder, and apply it to the target namespace.
# Never commit the populated version.
apiVersion: v1
kind: Secret
metadata:
  name: foreman-runtime
type: Opaque
stringData:
  DATABASE_URL: postgresql://foreman:CHANGE_ME@postgres.example.test:5432/foreman
  ENCRYPTION_KEY: CHANGE_ME
  SECRET_KEY_BASE: CHANGE_ME
  SEED_ADMIN_USER: admin
  SEED_ADMIN_PASSWORD: CHANGE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: foreman-database-ca
type: Opaque
stringData:
  db-ca.crt: |
    CHANGE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: foreman-shared
type: Opaque
stringData:
  candlepin-oauth-secret: CHANGE_ME
---
# Required only when authenticated SMTP is enabled.
apiVersion: v1
kind: Secret
metadata:
  name: foreman-smtp
type: Opaque
stringData:
  username: CHANGE_ME
  password: CHANGE_ME
---
# Optional shared outbound HTTP(S) proxy credentials. Keep the internal
# Kubernetes service suffixes in no-proxy and extend the value with the exact
# metadata or object-storage endpoints that must remain direct.
apiVersion: v1
kind: Secret
metadata:
  name: foreman-outbound-proxy
type: Opaque
stringData:
  http-proxy: http://user:password@proxy.example.test:3128
  https-proxy: http://user:password@proxy.example.test:3128
  no-proxy: localhost,127.0.0.1,.svc,.cluster.local
---
apiVersion: v1
kind: Secret
metadata:
  name: foreman-valkey
type: Opaque
stringData:
  # URI userinfo including the trailing @. Percent-encode reserved characters
  # in usernames and passwords, for example default:p%40ssword@.
  foreman-cache-uri-auth: CHANGE_ME@
  dynflow-uri-auth: CHANGE_ME@
  # Pulpcore's discrete Redis settings support password authentication for the
  # default ACL user and, unlike REDIS_URL, retain its separate CA setting.
  pulp-password: CHANGE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: valkey-ca
type: Opaque
stringData:
  ca.crt: |
    CHANGE_ME
---
apiVersion: v1
